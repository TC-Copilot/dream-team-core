name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-syntax:
    name: Syntax and manifest checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile app.py
        run: python -m py_compile app/app.py

      - name: Validate JSON files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'manifest.json', 'automations/automations.json') {
            $null = Get-Content -Raw -LiteralPath $f | ConvertFrom-Json
            Write-Host "[ok] $f is valid JSON"
          }

      - name: Automation metadata is self-consistent
        run: python test/check_automations.py

      - name: Automation optimization lint has regression coverage
        run: python test/test_automation_lint.py

      - name: Connector contracts are self-consistent
        run: python test/test_connector_contracts.py

      - name: Cost telemetry and job budgets are bounded
        run: python test/test_cost_budget_guards.py

      - name: Recommendation and How contracts are self-consistent
        run: python test/test_recommendation_contract.py

      - name: Tiered model guidance is provider-neutral and safeguard-preserving
        run: python test/test_model_routing_guidance.py

      - name: How sync lifecycle is checkpointed and review-gated
        run: python test/test_how_sync.py

      - name: Handled-item ledger is durable and thread-aware
        run: python -m unittest discover -s test -p "test_handled_item_ledger.py" -v

      - name: State delta cache contract is deterministic
        run: python test/test_state_delta_contract.py

      - name: Safe refresh controls preserve durable state and bound history sweeps
        run: python test/test_safe_refresh_controls.py

      - name: Blocker resolution classifier and lifecycle are safe
        run: python -m unittest discover -s test -p "test_blocker_resolution.py" -v

      - name: Blocker resolution UI contract is wired
        run: node test/test_blocker_resolution_ui.js

      - name: Approval categories preserve manual collapse state
        run: node test/test_approval_group_collapse.js

      - name: Service worker refreshes only Dream Team caches
        run: node test/test_service_worker_refresh.js

      - name: Core and overlay version compatibility contract is self-consistent
        shell: pwsh
        run: ./test/test-version-compatibility.ps1

      - name: Explicit install roots are isolated from global pointers
        shell: pwsh
        run: ./test/test-install-isolation.ps1

      - name: Published release targets are immutable
        shell: pwsh
        run: ./test/test-release-guards.ps1

      - name: Watch and follow-up model is self-consistent
        run: python test/test_watch_followups.py

      - name: Calendar conflict lifecycle preserves decision ownership
        run: python test/test_calendar_conflict_lifecycle.py

      - name: Layered install contract is self-consistent
        run: python test/test_layered_install_contract.py

      - name: Version is consistent across manifest, README and CHANGELOG
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          if (-not (Select-String -Path README.md -Pattern ("^Version {0}\." -f [regex]::Escape($version)) -Quiet)) {
            throw "README.md has no 'Version $version.' line matching manifest.json"
          }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch ("### {0}" -f $version) -Quiet)) {
            throw "CHANGELOG.md has no '### $version' section"
          }
          Write-Host "[ok] version $version is consistent"

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1 -File) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed += $file.FullName
              Write-Host "[FAIL] $($file.FullName)"
              $errors | ForEach-Object { Write-Host "    $($_.Message)" }
            } else {
              Write-Host "[ok] $($file.Name)"
            }
          }
          if ($failed.Count) { throw "$($failed.Count) PowerShell file(s) failed to parse" }

  verify-clean:
    name: Clean-room verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify-clean.ps1
        shell: pwsh
        run: ./verify-clean.ps1

  smoke-test:
    name: Smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Smoke test (default, no auth)
        shell: pwsh
        run: ./test/smoke-test.ps1 -Port 8999

      - name: Smoke test (--auth)
        shell: pwsh
        run: ./test/smoke-test.ps1 -Port 8998 -Auth
