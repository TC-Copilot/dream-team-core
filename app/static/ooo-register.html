<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b11f4b">
  <title>Daily Flow OOO Register</title>
  <script>
    (() => {
      let saved = "";
      try { saved = localStorage.getItem("df-theme") || ""; } catch {}
      const valid = ["light", "dark", "sepia", "aurora"];
      const theme = valid.includes(saved)
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .ooo-filter { display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
    .ooo-filter label { display:grid; gap:6px; font-weight:700; }
    .ooo-filter input { min-width:170px; }
    .ooo-scroll { overflow-x:auto; padding-bottom:6px; }
    .ooo-timeline { --person-width:180px; min-width:max-content; display:grid; gap:0; }
    .ooo-grid-row { display:grid; grid-template-columns:var(--person-width) repeat(var(--days), minmax(42px, 1fr)); }
    .ooo-corner, .ooo-date, .ooo-day, .ooo-person-name, .ooo-track {
      border-right:1px solid var(--cp-border); border-bottom:1px solid var(--cp-border);
    }
    .ooo-corner, .ooo-person-name { position:sticky; left:0; z-index:2; background:var(--cp-surface); }
    .ooo-corner { border-left:1px solid var(--cp-border); }
    .ooo-date, .ooo-day { padding:7px 5px; text-align:center; font-size:.78rem; }
    .ooo-date { border-top:1px solid var(--cp-border); font-weight:700; }
    .ooo-date.week-start, .ooo-day.week-start, .ooo-track.week-start { border-left:2px solid var(--cp-border-strong); }
    .ooo-person-name { border-left:1px solid var(--cp-border); padding:12px 10px; font-weight:700; }
    .ooo-track { min-height:44px; position:relative; background:var(--cp-surface-soft); }
    .ooo-bars { grid-column:2 / -1; grid-row:1; display:grid; grid-template-columns:repeat(var(--days), minmax(42px, 1fr)); align-items:center; pointer-events:none; }
    .ooo-bar {
      height:14px; margin:0; border-radius:7px; background:var(--cp-accent);
      box-shadow:inset 0 0 0 1px var(--cp-accent-hover);
      pointer-events:auto; z-index:1;
    }
    .ooo-bar:focus-visible { outline:3px solid var(--cp-link); outline-offset:3px; }
    @media (max-width:700px) { .ooo-timeline { --person-width:130px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <h1>Out-of-office register</h1>
        <p class="subtitle">Upcoming availability evidence from calendar OOO items and email OOO notices.</p>
      </div>
      <div class="toolbar">
        <a class="btn primary" href="index.html">Back to cockpit</a>
        <a class="btn" href="activity-log.html">Activity Log</a>
      </div>
    </header>

    <main class="grid-page">
      <section class="card section">
        <form class="ooo-filter" id="filterForm">
          <label>From <input type="date" id="fromDate" required></label>
          <label>To <input type="date" id="toDate" required></label>
          <button class="btn primary" type="submit">Apply date range</button>
        </form>
      </section>

      <section class="card section">
        <div class="section-head">
          <div>
            <h2>People away</h2>
            <p class="subtitle" id="summary">Loading the OOO register...</p>
          </div>
        </div>
        <div id="register" role="status" aria-live="polite" aria-busy="true">
          <div class="empty">Loading out-of-office dates...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="ooo-timeline.js"></script>
  <script>
    const register = document.getElementById("register");
    const summary = document.getElementById("summary");
    const fromDate = document.getElementById("fromDate");
    const toDate = document.getElementById("toDate");
    function storageGet(key) {
      try { return localStorage.getItem(key) || ""; } catch { return ""; }
    }
    const hidePersonNames = storageGet("df-hide-person-names") === "1";
    const personAliases = new Map();

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[char]);

    function localTokenHeaders() {
      const token = storageGet("dailyflow_token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function dateInput(value) {
      return value.toLocaleDateString("en-CA");
    }

    function displayPerson(name) {
      if (!hidePersonNames) return name;
      if (!personAliases.has(name)) personAliases.set(name, `Person ${personAliases.size + 1}`);
      return personAliases.get(name);
    }

    function barHtml(segment) {
      const confidence = Math.round(segment.confidence * 100);
      const label = `${segment.startDate} through ${segment.endDate}; ${segment.status}; ${confidence}% confidence; evidence: ${segment.sources}`;
      return `<span class="ooo-bar" tabindex="0" role="img"
        style="grid-column:${segment.start + 1} / span ${segment.span}"
        aria-label="${esc(label)}" title="${esc(label)}"></span>`;
    }

    function render(data) {
      register.setAttribute("aria-busy", "false");
      summary.textContent = `${data.totalPeople} ${data.totalPeople === 1 ? "person" : "people"}, ${data.totalPeriods} OOO ${data.totalPeriods === 1 ? "period" : "periods"}.`;
      if (!data.people.length) {
        register.innerHTML = `<div class="empty">No out-of-office periods overlap this date range.</div>`;
        return;
      }
      const model = OooTimeline.buildModel(data, fromDate.value, toDate.value);
      if (!model.dates.length) {
        register.innerHTML = `<div class="empty">No business days fall within this date range.</div>`;
        return;
      }
      const dayCount = model.dates.length;
      const dateHeaders = model.dates.map(date =>
        `<span class="ooo-date${date.weekStart ? " week-start" : ""}">${esc(date.label)}</span>`
      ).join("");
      const dayHeaders = model.dates.map(date =>
        `<span class="ooo-day${date.weekStart ? " week-start" : ""}">${esc(date.dayLabel)}</span>`
      ).join("");
      const rows = model.people.map(person => `
        <div class="ooo-grid-row" role="row" style="--days:${dayCount}">
          <div class="ooo-person-name">${esc(displayPerson(person.personName))}</div>
          ${model.dates.map(date => `<div class="ooo-track${date.weekStart ? " week-start" : ""}" aria-hidden="true"></div>`).join("")}
          <div class="ooo-bars">${person.segments.map(barHtml).join("")}</div>
        </div>
      `).join("");
      register.innerHTML = `<div class="ooo-scroll" tabindex="0" aria-label="Scrollable out-of-office timeline">
        <div class="ooo-timeline" role="table" aria-label="Out-of-office dates by person" style="--days:${dayCount}">
          <div class="ooo-grid-row" role="row" style="--days:${dayCount}">
            <span class="ooo-corner" aria-hidden="true"></span>${dateHeaders}
          </div>
          <div class="ooo-grid-row" role="row" style="--days:${dayCount}">
            <span class="ooo-corner">Person</span>${dayHeaders}
          </div>
          ${rows}
        </div>
      </div>`;
    }

    async function loadRegister() {
      register.setAttribute("aria-busy", "true");
      register.innerHTML = `<div class="empty">Loading out-of-office dates...</div>`;
      summary.textContent = "Loading the OOO register...";
      const params = new URLSearchParams({ from: fromDate.value, to: toDate.value });
      try {
        const response = await fetch(`/api/ooo?${params}`, {
          cache: "no-store",
          headers: localTokenHeaders()
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Unable to load OOO register (${response.status})`);
        render(data);
      } catch (error) {
        register.setAttribute("aria-busy", "false");
        summary.textContent = "The OOO register could not be loaded.";
        register.innerHTML = `<div class="empty" role="alert">${esc(error.message)}</div>`;
      }
    }

    const today = new Date();
    const horizon = new Date(today);
    horizon.setDate(horizon.getDate() + 90);
    fromDate.value = dateInput(today);
    toDate.value = dateInput(horizon);
    document.getElementById("filterForm").addEventListener("submit", event => {
      event.preventDefault();
      loadRegister();
    });
    loadRegister();
  </script>
  <script src="pwa.js" defer></script>
</body>
</html>
