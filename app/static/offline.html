<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Offline - The Dream Team</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b11f4b">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ef; color: #242424;
    }
    @media (prefers-color-scheme: dark) { body { background: #292929; color: #dedede; } }
    .card {
      max-width: 420px; text-align: center; padding: 32px 28px; border-radius: 16px;
      background: rgba(255,255,255,0.6); box-shadow: 0 18px 48px rgba(0,0,0,0.12);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; color: #6f6f6f; }
    button {
      font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 999px; border: none;
      background: #b11f4b; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>The Dream Team dashboard needs a connection to your local app to load fresh data. Once you're back online, this page will retry automatically.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
  <script src="pwa.js" defer></script>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
